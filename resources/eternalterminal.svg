<svg xmlns="http://www.w3.org/2000/svg" width="869" height="869" viewBox="0 0 869 869">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0.95" y2="1">
    <stop offset="0" stop-color="#202b3a"/>
    <stop offset="1" stop-color="#0a1118"/>
  </linearGradient>
  <linearGradient id="inf" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#168fe8"/>
    <stop offset="0.48" stop-color="#25b9cf"/>
    <stop offset="0.72" stop-color="#55d98b"/>
    <stop offset="1" stop-color="#82ef35"/>
  </linearGradient>
  <linearGradient id="topShade" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2a3748"/>
    <stop offset="1" stop-color="#182230"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity=".35"/>
  </filter>
</defs>

<!-- transparent outside; main terminal window -->
<rect x="16" y="35" width="837" height="792" rx="102" fill="url(#bg)" stroke="#344355" stroke-width="4"/>
<!-- subtle upper panel -->
<path d="M18 133C18 78 61 36 117 36H751C807 36 851 79 851 135V132C808 171 754 181 691 181H18Z" fill="url(#topShade)" opacity=".72"/>
<!-- separator -->
<path d="M29 181H840" stroke="#091017" stroke-width="4"/>

<!-- window controls -->
<circle cx="109" cy="116" r="23" fill="#ff514f"/>
<circle cx="179" cy="116" r="23" fill="#ffbd3e"/>
<circle cx="249" cy="116" r="23" fill="#1fc85b"/>

<!-- clean infinity mark -->
<path d="M434 462
 C380 365 330 274 230 274
 C130 274 68 356 68 462
 C68 568 130 650 230 650
 C330 650 380 559 434 462
 C488 365 538 274 638 274
 C738 274 800 356 800 462
 C800 568 738 650 638 650
 C538 650 488 559 434 462"
 fill="none" stroke="url(#inf)" stroke-width="62" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>

<!-- inner highlight following the same mathematically smooth path -->
<path d="M434 462
 C380 365 330 274 230 274
 C130 274 68 356 68 462
 C68 568 130 650 230 650
 C330 650 380 559 434 462
 C488 365 538 274 638 274
 C738 274 800 356 800 462
 C800 568 738 650 638 650
 C538 650 488 559 434 462"
 fill="none" stroke="#b8e6ff" stroke-width="2.5" stroke-linecap="round" opacity=".42"/>

<!-- terminal prompt -->
<g fill="none" stroke="#35465a" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
  <path d="M558 421L594 453L558 485"/>
  <path d="M622 518H674"/>
</g>
</svg>